<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="末班之后 Shanghai Metro Night — 上海地铁双向首末班时间地图：14 条线路、338 个车站">
  <title>末班之后 Shanghai Metro Night</title>
  <desc>上海地铁双向首末班时间地图：14 条线路、338 个车站，时间轴拖动查看各时段服务状态。</desc>

  <rect width="1200" height="420" rx="20" fill="#101B2D"/>
  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="52" r="2" opacity="0.7"/>
    <circle cx="210" cy="34" r="1.6" opacity="0.5"/>
    <circle cx="340" cy="60" r="2" opacity="0.6"/>
    <circle cx="470" cy="36" r="1.5" opacity="0.5"/>
    <circle cx="560" cy="70" r="2" opacity="0.7"/>
    <circle cx="620" cy="40" r="1.5" opacity="0.45"/>
    <circle cx="60" cy="380" r="1.6" opacity="0.5"/>
    <circle cx="480" cy="392" r="1.8" opacity="0.5"/>
  </g>

  <!-- left copy -->
  <text x="64" y="92" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#7EC8B8">上海地铁 · 首末班时间地图</text>
  <text x="62" y="168" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">末班之后</text>
  <text x="64" y="208" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600" letter-spacing="5" fill="#9FB3C8">SHANGHAI METRO NIGHT</text>
  <text x="64" y="260" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#D5DEE8">14 条线路、338 个车站，双向首末班一图看清</text>
  <text x="64" y="294" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#9FB3C8">拖动时间轴，看每个时刻哪些站还能上车</text>

  <!-- badges -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="600">
    <rect x="64" y="322" width="108" height="36" rx="18" fill="#1E6B52"/>
    <text x="118" y="346" text-anchor="middle" fill="#FFFFFF">14 条线路</text>
    <rect x="184" y="322" width="108" height="36" rx="18" fill="#16263C" stroke="#3D546E" stroke-width="1.5"/>
    <text x="238" y="346" text-anchor="middle" fill="#D5DEE8">338 车站</text>
    <rect x="304" y="322" width="216" height="36" rx="18" fill="#16263C" stroke="#3D546E" stroke-width="1.5"/>
    <text x="412" y="346" text-anchor="middle" fill="#D5DEE8">数据核验 2026-11-16</text>
  </g>

  <!-- right: mini schematic panel -->
  <g id="map-panel">
    <rect x="660" y="48" width="476" height="324" rx="16" fill="#16263C"/>
    <rect x="660" y="48" width="476" height="324" rx="16" fill="none" stroke="#2C435F" stroke-width="1.5"/>
    <!-- clock header -->
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="688" y="88" font-size="18" fill="#9FB3C8">所选时间</text>
      <text x="1108" y="92" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="end">23:10</text>
    </g>
    <!-- lines -->
    <g fill="none" stroke-linecap="round" stroke-width="7">
      <path d="M 700 300 L 700 210 Q 700 170 740 170 L 1096 170" stroke="#FF5A5A"/>
      <path d="M 700 240 L 1096 240" stroke="#4CC38A"/>
      <path d="M 860 120 L 860 300" stroke="#4DA3FF"/>
      <path d="M 980 120 L 1096 210 L 1096 300" stroke="#C9A0DC"/>
    </g>
    <!-- stations -->
    <g fill="#16263C" stroke="#FFFFFF" stroke-width="2.5">
      <circle cx="700" cy="240" r="7"/>
      <circle cx="780" cy="240" r="7"/>
      <circle cx="940" cy="240" r="7"/>
      <circle cx="1020" cy="240" r="7"/>
      <circle cx="860" cy="170" r="7"/>
      <circle cx="860" cy="300" r="7"/>
      <circle cx="980" cy="170" r="7"/>
      <circle cx="1096" cy="170" r="7"/>
    </g>
    <!-- interchange: people's square -->
    <circle cx="860" cy="240" r="11" fill="#16263C" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="860" cy="240" r="4" fill="#FFD166"/>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="878" y="234" font-size="19" font-weight="700" fill="#FFFFFF">人民广场</text>
      <text x="700" y="152" font-size="18" fill="#9FB3C8">1 号线</text>
      <text x="712" y="222" font-size="18" fill="#9FB3C8">2 号线</text>
      <text x="872" y="142" font-size="18" fill="#9FB3C8">4 号线</text>
      <text x="1000" y="292" font-size="18" fill="#9FB3C8">10 号线</text>
    </g>
    <!-- timeline -->
    <line x1="688" y1="334" x2="1108" y2="334" stroke="#3D546E" stroke-width="6" stroke-linecap="round"/>
    <line x1="688" y1="334" x2="1088" y2="334" stroke="#7EC8B8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1088" cy="334" r="9" fill="#7EC8B8" stroke="#16263C" stroke-width="2"/>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#9FB3C8">
      <text x="688" y="362">00:00</text>
      <text x="1108" y="362" text-anchor="end">23:59</text>
    </g>
  </g>
</svg>
